[package]
name = "gpui-agent-infrastructure"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
gpui-agent-contracts.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true
getrandom = "0.4"
rusqlite.workspace = true
gpui-agent-history.workspace = true
gpui-agent.workspace = true
gpui-agent-domain.workspace = true
gpui-agent-application.workspace = true

tempfile = "3"

reqwest.workspace = true
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tokio = { workspace = true, features = ["rt", "sync", "process", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
clack-private-fs = "1"
private-fs = "0.2.1"
winx = "0.36"

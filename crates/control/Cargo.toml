[package]
name = "gpui-agent-control"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
gpui-agent-ports.workspace = true
gpui-agent-contracts.workspace = true
gpui-agent-process.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
reqwest.workspace = true
tempfile = "3"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

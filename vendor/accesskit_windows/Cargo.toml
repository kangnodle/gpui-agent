[package]
name = "accesskit_windows"
version = "0.34.0"
edition = "2024"
rust-version = "1.85"
authors = ["The AccessKit contributors"]
license = "MIT OR Apache-2.0"
description = "AccessKit UI accessibility infrastructure: Windows adapter"
repository = "https://github.com/AccessKit/accesskit"
readme = "README.md"

[dependencies]
accesskit = "0.24.1"
accesskit_consumer = "0.38.0"
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
static_assertions = "1.1.0"
windows-core = "0.62.0"
windows = { version = "0.62.0", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

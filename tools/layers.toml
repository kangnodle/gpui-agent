# Approved workspace dependency graph. Cargo metadata tests enforce this policy.
# normal includes build dependencies; dev lists additional test-only edges.
[normal]
domain = []
contracts = ["domain"]
dci = ["contracts", "domain"]
presentation = ["contracts"]
ports = ["domain", "contracts"]
application = ["domain", "contracts", "dci", "ports"]
process = []
history = ["domain", "ports"]
agent = ["domain", "ports", "process"]
control = ["contracts", "ports", "process"]
infrastructure = ["agent", "application", "contracts", "domain", "history"]
api = ["application", "contracts"]
server = ["agent", "api", "control", "infrastructure"]
cli = ["agent", "infrastructure"]
desktop = ["agent", "api", "contracts", "control", "infrastructure", "presentation"]
harness = []

[dev]
api = ["agent", "control", "infrastructure"]
history = ["application", "contracts"]
harness = ["process"]
